plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ar.com.novasolutions.novashield'
version = '0.1.0'

android {
  // OJO: NO puede ser igual al `package` de la app (ar.com.novasolutions.novashield).
  //
  // El namespace decide dónde se generan BuildConfig y R. Si la librería usa el
  // mismo que la app, las dos generan `ar.com.novasolutions.novashield.BuildConfig`
  // y el build muere recién en `mergeDexRelease`, después de compilar todo, con
  // "Type ... is defined multiple times". Es el mismo error de fondo que el
  // podspec homónimo en iOS: dos cosas distintas peleándose un nombre.
  //
  // Las clases Kotlin siguen en `ar.com.novasolutions.novashield` —el namespace
  // no las mueve— así que el manifest, el autolinking y expo-module.config.json
  // no cambian.
  namespace "ar.com.novasolutions.novashield.nativemodule"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // `AppContextActivityResultLauncher.launch` recibe un ActivityResultCallback,
  // que vive acá. expo-modules-core lo usa en su API pública pero lo declara
  // como `implementation`, así que NO llega transitivamente: sin esta línea el
  // diálogo de consentimiento de VPN no compila ("Cannot access class
  // 'ActivityResultCallback'"). La versión es la que ya resuelve appcompat en
  // esta app; si algo pide una más nueva, Gradle la sube solo.
  implementation "androidx.activity:activity:1.7.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  // BiometricManager.canAuthenticate distingue "hay sensor" de "hay biometría
  // enrolada"; hasSystemFeature(FEATURE_FINGERPRINT) solo dice lo primero.
  implementation "androidx.biometric:biometric:1.1.0"
}
